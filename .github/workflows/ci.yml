name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      graphics:
        description: "Graphics API for the build"
        type: choice
        options: [webgl2, webgpu]
        default: webgl2
      clean_cache:
        description: "Wipe Bee/IL2CPP caches first (slow; only if a build segfaults)"
        type: boolean
        default: false
      optimize_speed:
        description: "IL2CPP OptimizeSpeed (slower build, slightly faster runtime)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # RocketSim is only used as the reference for the parity test; it is pinned so the test is reproducible.
  ROCKETSIM_REF: c2baacb8f4b441dd8505e63c2aeb5a1679b60b02

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON / YAML sanity
        run: |
          python3 -c "import json;json.load(open('Packages/manifest.json'));json.load(open('deploy/vercel.json'))"
          python3 -c "import yaml;yaml.safe_load(open('.github/workflows/ci.yml'))"

  parity:
    name: Vehicle model vs native RocketSim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Fetch RocketSim (reference)
        run: git clone https://github.com/ZealanL/RocketSim.git /tmp/RocketSim && git -C /tmp/RocketSim checkout "$ROCKETSIM_REF"
      - name: Build both and compare every scenario
        run: bash tools/parity/build.sh /tmp/RocketSim "$(nproc)"

  unity-web:
    name: Unity 6000.0.62f1 WebGL build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # lets the job push the build to the release branch
    # No `needs`: the Unity build runs in parallel with the static checks / parity test; publishing waits for all three.
    outputs:
      built: ${{ steps.lic.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - name: Check Unity license secrets
        id: lic
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::warning::No UNITY_LICENSE/UNITY_SERIAL secret - skipping the Unity build. See README."; fi
      - uses: actions/cache@v4
        if: steps.lic.outputs.ok == 'true'
        with:
          path: Library
          # v4: keep Bee/IL2CPP output so the C++ compile is incremental (it was the bulk of the build time)
          key: Library-WebGL-v4-${{ hashFiles('Packages/manifest.json', 'Assets/**/*.cs') }}
          restore-keys: |
            Library-WebGL-v4-
      - name: Drop stale Bee / IL2CPP artifacts (manual only)
        if: steps.lic.outputs.ok == 'true' && inputs.clean_cache == true
        run: |
          # Partial Library restores leave inconsistent Bee/IL2CPP state; il2cpp then SIGSEGVs (exit 139).
          rm -rf Library/Bee Library/Il2cppBuildCache Library/BuildPlayerData \
                 Library/PlayerDataCache Library/ShaderCache Library/BuildCache
          echo "Cleaned Bee/IL2CPP caches. Remaining Library:"
          du -sh Library 2>/dev/null || true
      - name: Unity WebGL build
        id: build
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        if: steps.lic.outputs.ok == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          ION_TOKEN: ${{ secrets.ION_TOKEN }}
          UNITY_CLOUD_PROJECT_ID: ${{ secrets.UNITY_CLOUD_PROJECT_ID }}
        with:
          unityVersion: 6000.0.62f1
          targetPlatform: WebGL
          buildMethod: RocketWorld.Editor.BuildScript.BuildWebGL
          customParameters: -rwGfx ${{ inputs.graphics == 'webgpu' && 'webgpu' || 'webgl2' }} -rwFast ${{ github.event_name == 'pull_request' && '1' || '0' }} -rwSpeed ${{ inputs.optimize_speed == true && '1' || '0' }}
          versioning: None
          allowDirtyBuild: true
      - name: Retry from clean Bee/IL2CPP state (only if the cached build failed, e.g. exit 139)
        id: retry
        if: steps.lic.outputs.ok == 'true' && steps.build.outcome == 'failure'
        run: |
          sudo rm -rf Library/Bee Library/Il2cppBuildCache Library/BuildPlayerData Library/PlayerDataCache Library/ShaderCache Library/BuildCache
      - name: Unity WebGL build (clean retry)
        if: steps.lic.outputs.ok == 'true' && steps.build.outcome == 'failure'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          ION_TOKEN: ${{ secrets.ION_TOKEN }}
          UNITY_CLOUD_PROJECT_ID: ${{ secrets.UNITY_CLOUD_PROJECT_ID }}
        with:
          unityVersion: 6000.0.62f1
          targetPlatform: WebGL
          buildMethod: RocketWorld.Editor.BuildScript.BuildWebGL
          customParameters: -rwGfx ${{ inputs.graphics == 'webgpu' && 'webgpu' || 'webgl2' }} -rwFast ${{ github.event_name == 'pull_request' && '1' || '0' }} -rwSpeed ${{ inputs.optimize_speed == true && '1' || '0' }}
          versioning: None
          allowDirtyBuild: true
      - name: Add Vercel config + bake ION_TOKEN into index.html
        if: steps.lic.outputs.ok == 'true'
        env:
          ION_TOKEN: ${{ secrets.ION_TOKEN }}
        run: |
          # game-ci builds inside a root container: take ownership first. The player lands in build/WebGL/WebGL.
          sudo chown -R "$(id -u):$(id -g)" build
          cp deploy/vercel.json build/WebGL/WebGL/vercel.json
          cp deploy/cesiumjs-compare.html build/WebGL/WebGL/cesiumjs-compare.html   # CesiumJS reference page: /cesiumjs-compare.html
          # Ensure the Cesium ion token is present even if Unity's PostProcessIndex did not see the env var.
          if [ -n "$ION_TOKEN" ]; then
            python3 tools/bake_ion_token.py build/WebGL/WebGL/index.html
          else
            echo "::warning::ION_TOKEN secret is empty — Cesium tiles will not load until a token is provided"
          fi
          ls -la build/WebGL/WebGL build/WebGL/WebGL/Build
      - uses: actions/upload-artifact@v4
        if: steps.lic.outputs.ok == 'true'
        with:
          name: rocketworld-webgl
          path: build/WebGL/WebGL
          compression-level: 0   # Build files are already Brotli-compressed

  publish-release:
    name: Publish to release branch
    runs-on: ubuntu-latest
    needs: [checks, parity, unity-web]
    if: needs.unity-web.outputs.built == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rocketworld-webgl
          path: webgl
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: webgl
          force_orphan: true
          enable_jekyll: false
          commit_message: "release ${{ github.sha }}"

  # After the WebGL artifact is produced: download-artifact unpacks it,
  # then the player is force-pushed to renatoehzproyectos/op-test (main).
  deploy-op-test:
    name: Deploy WebGL → op-test
    runs-on: ubuntu-latest
    needs: [checks, parity, unity-web]
    if: needs.unity-web.outputs.built == 'true' && github.event_name != 'pull_request'
    steps:
      - name: Download rocketworld-webgl artifact
        uses: actions/download-artifact@v4
        with:
          name: rocketworld-webgl
          path: webgl

      - name: Show what will be published
        run: |
          echo "Contents of the WebGL player:"
          find webgl -maxdepth 2 -type f | head -40
          test -f webgl/index.html
          test -d webgl/Build

      - name: Push to renatoehzproyectos/op-test
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAT }}
          external_repository: renatoehzproyectos/op-test
          publish_dir: ./webgl
          publish_branch: main
          force_orphan: true
          enable_jekyll: false
          commit_message: "deploy rocketworld-webgl from ${{ github.repository }}@${{ github.sha }}"
